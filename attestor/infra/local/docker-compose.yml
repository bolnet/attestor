# Attestor local stack — three storage-role containers (+ optional API).
#
#   attestor_postgres_document_db   Postgres 16 + pgvector — document store.
#   attestor_pinecone_vector_db     Pinecone Local emulator — vector store.
#   attestor_neo4j_graph_db         Neo4j 5 Community + GDS plugin — graph store.
#   attestor_api                    Optional slim HTTP API (not started by quickstart).
#   attestor_temporal_server        OPT-IN (--profile durable): Temporal server for the
#                                   governance jobs; shares the Postgres container above.
#   attestor_temporal_ui            OPT-IN (--profile durable): Temporal Web UI on :8233.
#
# Naming convention: every container/resource is `attestor_<meaningful>` — the
# compose project name (`attestor`) also prefixes the named volumes
# (attestor_postgres_data, attestor_neo4j_data, …).
#
# Usage:
#   docker compose up -d postgres neo4j pinecone   # what `attestor quickstart` runs
#   docker compose --profile durable up -d postgres neo4j pinecone temporal temporal-ui
#                                                  # what `attestor quickstart --durable` runs
#   docker compose down                            # stop (keeps volumes/data)
#   docker compose down -v                         # stop + wipe volumes (deletes memories)

name: attestor

services:

  # ─────────────────────── DB: Postgres 16 + pgvector ─────────────────────
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: attestor/db-postgres:16
    container_name: attestor_postgres_document_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attestor}
      POSTGRES_DB: attestor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attestor"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # ─────────────────── DB: Neo4j 5 Community + GDS ────────────────────────
  neo4j:
    image: neo4j:5.24-community
    container_name: attestor_neo4j_graph_db
    ports:
      - "7474:7474"   # HTTP / Browser UI
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-attestor}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ──────────────────────── Vector: Pinecone Local ────────────────────────
  # pinecone-local ships amd64-only; on Apple Silicon Docker uses Rosetta.
  # The explicit platform directive ensures Rosetta is engaged and the server
  # process binds correctly.
  pinecone:
    image: ghcr.io/pinecone-io/pinecone-local:latest
    platform: linux/amd64
    container_name: attestor_pinecone_vector_db
    ports:
      - "5080-5090:5080-5090"
    environment:
      PORT: 5080
      PINECONE_HOST: localhost
    restart: unless-stopped

  # ───────────────────────── API: slim, separate ──────────────────────────
  attestor-api:
    build:
      context: ../../..
      dockerfile: attestor/infra/local/api.Dockerfile
    image: attestor/api:4.0.0
    container_name: attestor_api
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:-attestor}@postgres:5432/attestor
      POSTGRES_DATABASE: attestor
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attestor}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-attestor}
      # Stack config — ATTESTOR_CONFIG overrides the baked-in configs/attestor.yaml.
      # Local dev mounts ~/.attestor/attestor.yaml (Ollama embedder, no cloud keys
      # required). Cloud deploys: omit ATTESTOR_CONFIG (uses the baked-in Voyage
      # default) and supply VOYAGE_API_KEY + PINECONE_API_KEY instead.
      ATTESTOR_CONFIG: ${ATTESTOR_CONFIG:-/data/config/attestor.yaml}
      # Ollama on the host — host.docker.internal resolves to the Docker host.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # Pinecone Local requires a non-empty key; "local" works for the local server.
      # Override by exporting PINECONE_API_KEY before running compose for cloud deploys.
      PINECONE_API_KEY: local
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ATTESTOR_DATA_DIR: /data/attestor
    volumes:
      - api_data:/data/attestor
      - ./docker-attestor.yaml:/data/config/attestor.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      pinecone:
        condition: service_started
    restart: unless-stopped

  # ─────────────── OPT-IN: Temporal (durable governance jobs) ─────────────
  # Started ONLY with `--profile durable` (plain quickstart is unchanged).
  # auto-setup reuses the Postgres container above (same credentials) and
  # creates the `temporal` + `temporal_visibility` databases itself, plus
  # the `attestor` namespace so it matches configs/attestor.yaml
  # `durable.namespace`. Temporal holds JOB state only — Postgres `attestor`
  # DB stays the source of truth for every memory.
  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: attestor_temporal_server
    profiles: ["durable"]
    ports:
      - "7233:7233"   # gRPC frontend — configs/attestor.yaml durable.address
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-attestor}
      POSTGRES_SEEDS: postgres
      DEFAULT_NAMESPACE: attestor
      # Exposed on the host, so tell clients + the UI where the frontend is.
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.53.3
    container_name: attestor_temporal_ui
    profiles: ["durable"]
    ports:
      - "8233:8080"   # http://localhost:8233 — every governance job, retry, and failure
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: attestor
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    depends_on:
      - temporal
    restart: unless-stopped

# Project name `attestor` (above) prefixes every named volume → they all become
# attestor_postgres_data, attestor_neo4j_data, … so `docker volume ls | grep attestor`
# catches them all.
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  api_data:
