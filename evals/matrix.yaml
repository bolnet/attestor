# Eval matrix — declarative ablation spec for LME-S benches.
#
# Each cell expands into one Braintrust experiment under
# `attestor-lme-s/lme-<category>:<label>`. The runner (evals/runner.py)
# reads this file, optionally prints a dry-run cost/wallclock estimate,
# then invokes evals/braintrust_longmemeval.py once per cell.
#
# Scope per `feedback_eval_scope_lme_s_only` + `feedback_lme_s_four_category_split`:
#   - LME-S only (no LOCOMO/MAB)
#   - 4 categories, Option B (414 of 500 questions)
#   - Each category gets its own GOLDEN cell + ablation cells

project: attestor-lme-s

# ── Cell catalog ───────────────────────────────────────────────────────
# Each cell is one experiment. Add rows to extend ablations.
# Required keys:
#   category    — one of {temporal-reasoning, multi-session,
#                         knowledge-update, single-session-user}
#   label       — experiment-name suffix (lme-<short-cat>:<label>)
#   samples     — sample cap (10 = smoke; 30/full per project memory)
# Optional overrides (set_stack runtime, YAML untouched):
#   embedder    — { provider, model }
#   self_consistency — bool (k=5, voter=judge_pick when true)
#
# Cost estimates assume parallel=1 and the canonical answerer gpt-5.5
# at reasoning_effort=high. Adjust when running larger sample counts.

cells:
  # ── GOLDEN baselines (one per category, all 10q smoke) ─────────────
  - { category: temporal-reasoning,  label: GOLDEN, samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      cost_usd: 0.06, wall_min: 22 }
  - { category: multi-session,       label: GOLDEN, samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      cost_usd: 0.06, wall_min: 22 }
  - { category: knowledge-update,    label: GOLDEN, samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      cost_usd: 0.06, wall_min: 22 }
  - { category: single-session-user, label: GOLDEN, samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      cost_usd: 0.06, wall_min: 22 }

  # ── Embedder ablation (temporal only — extend per category as needed)
  - { category: temporal-reasoning,
      label: "ablation:embedder=pinecone-llama",
      samples: 10,
      embedder: { provider: pinecone, model: llama-text-embed-v2 },
      cost_usd: 0.06, wall_min: 24,
      note: "blocked by Pinecone Inference monthly cap until 2026-06-01" }

  # ── Self-consistency ablation (already shown null on temporal) ─────
  - { category: temporal-reasoning,
      label: "ablation:self_consistency-k5",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      self_consistency: true,
      cost_usd: 0.30, wall_min: 31,
      note: "memory says null on this slice; included for cross-category test" }

  # ── Knowledge-update ablations (mirror temporal — same retrieval bottleneck) ──
  # Per the 2026-05-02 oracle-facts sweep: KU is also retrieval-bottlenecked
  # (3 of 3 wrong samples recover under haiku-4.5 + oracle facts). The same
  # answerer-swap + retrieval-side fixes that lift temporal will lift KU.
  - { category: knowledge-update,
      label: "ablation:answerer=haiku-4.5",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      answerer: openrouter/anthropic/claude-haiku-4.5,
      cost_usd: 0.02, wall_min: 18,
      note: "haiku-4.5 picked most-recent fact correctly on all 3 wrongs in oracle-facts smoke" }

  - { category: knowledge-update,
      label: "ablation:embedder=pinecone-llama",
      samples: 10,
      embedder: { provider: pinecone, model: llama-text-embed-v2 },
      cost_usd: 0.06, wall_min: 24,
      note: "blocked by Pinecone Inference monthly cap until 2026-06-01" }

  - { category: knowledge-update,
      label: "ablation:self_consistency-k5",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      self_consistency: true,
      cost_usd: 0.30, wall_min: 31,
      note: "self_consistency was null on temporal; cross-category test for KU" }

  # ── Contextual embedding (Anthropic Sept-2024) — one cell per category ──
  # When `contextual_embedding: true`, AgentMemory.add() runs a Haiku-4.5
  # pre-pass that writes 1-2 sentences situating each new memory in the
  # last 5 session turns; the prefixed form is embedded. Anthropic's eval:
  # ~49% reduction in retrieval failures. Cost ~ +$0.01 / sample over GOLDEN.
  - { category: temporal-reasoning,
      label: "ablation:contextual_embedding=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      contextual_embedding: true,
      cost_usd: 0.07, wall_min: 26,
      note: "Anthropic chunk-context prefix at ingest; expect +5-15% recall@10" }

  - { category: multi-session,
      label: "ablation:contextual_embedding=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      contextual_embedding: true,
      cost_usd: 0.07, wall_min: 26,
      note: "Anthropic chunk-context prefix at ingest; expect +5-15% recall@10" }

  - { category: knowledge-update,
      label: "ablation:contextual_embedding=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      contextual_embedding: true,
      cost_usd: 0.07, wall_min: 26,
      note: "Anthropic chunk-context prefix at ingest; expect +5-15% recall@10" }

  - { category: single-session-user,
      label: "ablation:contextual_embedding=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      contextual_embedding: true,
      cost_usd: 0.07, wall_min: 26,
      note: "Anthropic chunk-context prefix at ingest; expect +5-15% recall@10" }

  # ── LLM-driven entity extraction (Mem0/Zep alignment) — one cell per category ──
  # When `llm_entity_extraction: true`, AgentMemory.add() runs a
  # claude-haiku-4.5 pass at ingest that pulls proper-noun + value-bearing
  # entities and explicit relationships, replacing the regex-based
  # attestor.graph.extractor (which returns entity_count=0 for most
  # LME-S content). Failure-isolated: LLM timeout / malformed JSON
  # degrades to the regex extractor, never to empty.
  # Cost ~ +$0.003 / sample (10 ingests * $0.0003). Expect lift on
  # knowledge-update + multi-session where supersession depends on the
  # graph layer surfacing entity-level overlap.
  - { category: temporal-reasoning,
      label: "ablation:llm_entity_extraction=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      llm_entity_extraction: true,
      cost_usd: 0.07, wall_min: 24,
      note: "LLM entity extraction at ingest (Mem0/Zep); expect graph layer to fire for first time on natural-language content" }

  - { category: multi-session,
      label: "ablation:llm_entity_extraction=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      llm_entity_extraction: true,
      cost_usd: 0.07, wall_min: 24,
      note: "LLM entity extraction at ingest (Mem0/Zep); cross-session entity continuity is the graph's strongest signal" }

  - { category: knowledge-update,
      label: "ablation:llm_entity_extraction=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      llm_entity_extraction: true,
      cost_usd: 0.07, wall_min: 24,
      note: "LLM entity extraction at ingest (Mem0/Zep); the 852ce960 pre-approval failure motivated this PR — KU is where supersession lives" }

  - { category: single-session-user,
      label: "ablation:llm_entity_extraction=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      llm_entity_extraction: true,
      cost_usd: 0.07, wall_min: 24,
      note: "LLM entity extraction at ingest (Mem0/Zep); user-profile facts are entity-anchored" }

  # ── Reranker stage ablations (Phase 1 — one cell per LME-S category) ──
  # Phase 1 reranker bench — enable when local GPU available. The BGE
  # cross-encoder (BAAI/bge-reranker-v2-gemma) lazy-loads ~2GB on first
  # call; bench cells run on a single category to keep the load amortized.
  # Per Anthropic's Sept-2024 contextual-retrieval research, a reranker
  # is the highest-leverage retrieval-side improvement after vector +
  # BM25 + RRF (~+60% retrieval quality).
  - { category: temporal-reasoning,
      label: "ablation:reranker=bge",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      reranker_provider: bge,
      cost_usd: 0.06, wall_min: 24,
      note: "Phase 1 reranker bench — enable when local GPU available" }

  - { category: multi-session,
      label: "ablation:reranker=bge",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      reranker_provider: bge,
      cost_usd: 0.06, wall_min: 24,
      note: "Phase 1 reranker bench — enable when local GPU available" }

  - { category: knowledge-update,
      label: "ablation:reranker=bge",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      reranker_provider: bge,
      cost_usd: 0.06, wall_min: 24,
      note: "Phase 1 reranker bench — enable when local GPU available" }

  - { category: single-session-user,
      label: "ablation:reranker=bge",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      reranker_provider: bge,
      cost_usd: 0.06, wall_min: 24,
      note: "Phase 1 reranker bench — enable when local GPU available" }

  # ── Global query (multi-hop / GraphRAG-style) — one cell per category ──
  # When `global_query: true`, recall() routes "summarize / over time /
  # across / recurring / themes / patterns" questions to a Neo4j Leiden
  # community-detect + LLM-summarize lane in front of the 6-step cascade.
  # Default off; per Microsoft GraphRAG and HippoRAG, the lift on global
  # queries is ~25-40pp where local queries are unaffected.
  - { category: temporal-reasoning,
      label: "ablation:global_query=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      global_query: true,
      cost_usd: 0.10, wall_min: 26,
      note: "Phase 9 GraphRAG lane; expect lift only on time-spanning questions" }

  - { category: multi-session,
      label: "ablation:global_query=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      global_query: true,
      cost_usd: 0.10, wall_min: 26,
      note: "Phase 9 GraphRAG lane; multi-session is the prime target" }

  - { category: knowledge-update,
      label: "ablation:global_query=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      global_query: true,
      cost_usd: 0.10, wall_min: 26,
      note: "Phase 9 GraphRAG lane; KU is mostly local — sanity-check cell" }

  - { category: single-session-user,
      label: "ablation:global_query=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      global_query: true,
      cost_usd: 0.10, wall_min: 26,
      note: "Phase 9 GraphRAG lane; mostly local — null-result cell" }

  # ── Long-context fit (alternate Step 6 — skip MMR + greedy-fit) ─────
  # When ``long_context: true``, recall() skips Step 5 (MMR diversity)
  # and Step 6 packs the top-K reranked candidates verbatim up to the
  # configured cap (default 200_000 tokens). Designed for downstream
  # 1M-context answerers (Claude Sonnet 4.6 / Opus 4.x / Gemini 2 Pro)
  # where diversity penalties cut genuinely-relevant near-duplicates.
  # Matched-pair vs GOLDEN per category to isolate the Step-6 swap.
  - { category: temporal-reasoning,
      label: "ablation:long_context=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      long_context: true,
      cost_usd: 0.06, wall_min: 22,
      note: "Step 6 swap — pack top-K verbatim (200k cap), MMR off" }

  - { category: temporal-reasoning,
      label: "ablation:long_context=on+reranker=bge",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      long_context: true,
      reranker_provider: bge,
      cost_usd: 0.06, wall_min: 24,
      note: "long-context fit downstream of BGE rerank — no MMR diversity cut" }

  - { category: multi-session,
      label: "ablation:long_context=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      long_context: true,
      cost_usd: 0.06, wall_min: 22,
      note: "Step 6 swap — pack top-K verbatim (200k cap), MMR off" }

  - { category: multi-session,
      label: "ablation:long_context=on+reranker=bge",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      long_context: true,
      reranker_provider: bge,
      cost_usd: 0.06, wall_min: 24,
      note: "long-context fit downstream of BGE rerank — no MMR diversity cut" }

  - { category: knowledge-update,
      label: "ablation:long_context=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      long_context: true,
      cost_usd: 0.06, wall_min: 22,
      note: "Step 6 swap — pack top-K verbatim (200k cap), MMR off" }

  - { category: knowledge-update,
      label: "ablation:long_context=on+reranker=bge",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      long_context: true,
      reranker_provider: bge,
      cost_usd: 0.06, wall_min: 24,
      note: "long-context fit downstream of BGE rerank — no MMR diversity cut" }

  - { category: single-session-user,
      label: "ablation:long_context=on",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      long_context: true,
      cost_usd: 0.06, wall_min: 22,
      note: "Step 6 swap — pack top-K verbatim (200k cap), MMR off" }

  - { category: single-session-user,
      label: "ablation:long_context=on+reranker=bge",
      samples: 10,
      embedder: { provider: voyage, model: voyage-4 },
      long_context: true,
      reranker_provider: bge,
      cost_usd: 0.06, wall_min: 24,
      note: "long-context fit downstream of BGE rerank — no MMR diversity cut" }

  # Add more cells here as ablations are designed. Examples to seed:
  #
  # - { category: multi-session, label: "ablation:hyde=off", samples: 10,
  #     embedder: { provider: voyage, model: voyage-4 },
  #     hyde: false, cost_usd: 0.06, wall_min: 22 }
