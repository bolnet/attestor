<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#e8e3d8;color:#0f0e0c;font-family:'Newsreader',Georgia,serif;-webkit-font-smoothing:antialiased;font-optical-sizing:auto;position:relative}
.card{position:absolute;inset:0;padding:52px 64px;display:flex;flex-direction:column;justify-content:space-between}
.mid{margin:auto 0;padding:8px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #d4cfc3;padding-bottom:18px}
.brand{font-size:26px;font-weight:600;color:#0d1f3c;letter-spacing:-0.01em}
.brand b{color:#2a5c3a;font-weight:600}
.mono{font-family:'JetBrains Mono',monospace;font-size:15px;color:#625e56;letter-spacing:0.02em}
h1{font-size:82px;line-height:1.0;letter-spacing:-0.035em;font-weight:600;color:#0d1f3c;max-width:12.5ch;text-wrap:balance}
h1 i{font-style:italic;font-weight:500;color:#2a5c3a}
.deck{margin-top:26px;font-size:26px;line-height:1.35;color:#3a3630;max-width:46ch;text-wrap:pretty}
.deck b{color:#0f0e0c;font-weight:600}
.bot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #d4cfc3;padding-top:18px}
.bot .mono span+span::before{content:'·';margin:0 12px;color:#b9b2a3}
</style></head><body>
<div class="card">
  <div class="top">
    <div class="brand">attestor<b>.dev</b></div>
    <div class="mono">GOVERNED MEMORY FOR MULTI-AGENT PRODUCTION MESHES</div>
  </div>
  <div class="mid">
    <h1>Memory your agent mesh can be <i>audited</i> on.</h1>
    <p class="deck"><b>Who may write, who may forget, what an answer was built from</b> — enforced in code, not in a policy document. Self-hosted. Open source.</p>
  </div>
  <div class="bot">
    <div class="mono"><span>PYTHON</span><span>REST</span><span>MCP</span><span>POSTGRES + PINECONE + NEO4J</span></div>
    <div class="mono">MIT</div>
  </div>
</div>
</body></html>
